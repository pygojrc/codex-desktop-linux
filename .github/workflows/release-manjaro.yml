name: Release Manjaro KDE x86_64 package

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and republish even if this upstream version already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-manjaro-x86_64
  cancel-in-progress: false

env:
  ARCH_IMAGE: archlinux:base-devel
  UPSTREAM_PACKAGES_URL: https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages
  UPSTREAM_DEB_BASE_URL: https://persistent.oaistatic.com/codex-app-prod/linux/deb

jobs:
  check:
    if: github.repository == 'pygojrc/codex-desktop-linux'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      upstream_url: ${{ steps.check.outputs.upstream_url }}
      upstream_sha256: ${{ steps.check.outputs.upstream_sha256 }}
    steps:
      - name: Check official APT package index
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -Eeuo pipefail

          packages_path="$(mktemp)"
          trap 'rm -f "$packages_path"' EXIT

          curl --fail --location --retry 3 --retry-all-errors             --output "$packages_path" "$UPSTREAM_PACKAGES_URL"

          package_name="$(awk '
            /^Package: chatgpt$/ { found=1; print $2; exit }
          ' "$packages_path")"
          version="$(awk '
            /^Package: chatgpt$/ { inpkg=1; next }
            inpkg && /^Version:/ { print $2; exit }
            inpkg && /^$/ { inpkg=0 }
          ' "$packages_path")"
          filename="$(awk '
            /^Package: chatgpt$/ { inpkg=1; next }
            inpkg && /^Filename:/ { print $2; exit }
            inpkg && /^$/ { inpkg=0 }
          ' "$packages_path")"
          sha256="$(awk '
            /^Package: chatgpt$/ { inpkg=1; next }
            inpkg && /^SHA256:/ { print $2; exit }
            inpkg && /^$/ { inpkg=0 }
          ' "$packages_path")"

          test "$package_name" = chatgpt
          test -n "$version"
          test -n "$filename"
          [[ "$sha256" =~ ^[0-9a-fA-F]{64}$ ]]

          upstream_url="${UPSTREAM_DEB_BASE_URL}/${filename}"
          release_tag="manjaro-kde-${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$upstream_url" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256=$sha256" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE_BUILD" == true ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested for upstream version $version"
          elif gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream version $version is already published as $release_tag; nothing to do."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream version detected from Packages index: $version"
            echo "Package URL: $upstream_url"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux
        env:
          UPSTREAM_URL: ${{ needs.check.outputs.upstream_url }}
          UPSTREAM_SHA256: ${{ needs.check.outputs.upstream_sha256 }}
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -Eeuo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          docker run --rm             -e RUNNER_UID="$RUNNER_UID" -e RUNNER_GID="$RUNNER_GID"             -e CHATGPT_DEB_URL="$UPSTREAM_URL"             -e CHATGPT_DEB_SHA256="$UPSTREAM_SHA256"             -e EXPECTED_UPSTREAM_VERSION="$EXPECTED_VERSION"             -v "$GITHUB_WORKSPACE:/work"             -w /work             "$ARCH_IMAGE" bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed ca-certificates curl dpkg git
              groupadd --gid "$RUNNER_GID" codex-build 2>/dev/null || true
              useradd --uid "$RUNNER_UID" --gid "$RUNNER_GID" --create-home --shell /bin/bash codex-build 2>/dev/null || true
              chown -R "$RUNNER_UID:$RUNNER_GID" /work
              runuser -u codex-build -- env                 HOME=/home/codex-build                 CHATGPT_DEB_URL="$CHATGPT_DEB_URL"                 CHATGPT_DEB_SHA256="$CHATGPT_DEB_SHA256"                 EXPECTED_UPSTREAM_VERSION="$EXPECTED_UPSTREAM_VERSION"                 ./scripts/build-manjaro.sh
            '
      - name: Verify package and publish inputs
        id: metadata
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
          EXPECTED_UPSTREAM_SHA256: ${{ needs.check.outputs.upstream_sha256 }}
        run: |
          set -Eeuo pipefail
          package="$(jq -r .package dist/release-metadata.json)"
          test -f "dist/$package"
          (cd dist && sha256sum --check "$package.sha256")
          version="$(jq -r .upstreamVersion dist/release-metadata.json)"
          upstream_sha256="$(jq -r .upstreamSha256 dist/release-metadata.json)"
          test "$version" = "$EXPECTED_VERSION"
          test "$upstream_sha256" = "$EXPECTED_UPSTREAM_SHA256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: manjaro-kde-x86_64
          path: |
            dist/*.pkg.zst
            dist/*.sha256
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE_FILE: ${{ steps.metadata.outputs.package }}
        run: |
          set -Eeuo pipefail
          release_tag="manjaro-kde-${UPSTREAM_VERSION}"
          cat > release-notes.md <<EOF
          基于 ChatGPT 官方 Linux `.deb` ${UPSTREAM_VERSION} 的 Manjaro KDE x86_64 软件包。

          更新检测：GitHub Actions 每 30 分钟读取官方 APT `Packages` 索引；只有发现尚未发布的新版本时才下载对应 `.deb`，并按索引提供的 SHA-256 校验后构建。

          构建方式：仅使用 `dpkg-deb -x` 解包官方 Debian 数据区，再用 Arch `makepkg` 重打包；不会执行 Debian 安装脚本，也不会修改应用内部模型选择逻辑。

          安装：
          ```bash
          sudo pacman -U ${PACKAGE_FILE}
          ```

          KDE/Fcitx5 五笔兼容：`/usr/bin/chatgpt` 包装脚本固定设置 `GTK_IM_MODULE=fcitx XMODIFIERS=@im=fcitx`。
          EOF
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag"               "dist/$PACKAGE_FILE"               "dist/$PACKAGE_FILE.sha256"               dist/release-metadata.json               --clobber               --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag"               --title "Manjaro KDE x86_64 ${UPSTREAM_VERSION}"               --notes-file release-notes.md               --latest               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag"               "dist/$PACKAGE_FILE"               "dist/$PACKAGE_FILE.sha256"               dist/release-metadata.json               --target "$GITHUB_SHA"               --title "Manjaro KDE x86_64 ${UPSTREAM_VERSION}"               --notes-file release-notes.md               --latest               --repo "$GITHUB_REPOSITORY"
          fi
